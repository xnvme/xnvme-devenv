# rdma-node-emulated: an emulated RDMA NIC whose far end is an NVMe/RDMA
# target, for testing an NVMe-oF initiator without RDMA hardware. The NIC is
# rocm-ernic, whose server runs its nvmeof backend and answers over the
# emulated RDMA transport as an NVMe controller, so the guest and the server
# are all a test needs. See cijoe/scripts/rig.py for the format.

[rig.devices.nic0]
provider = "vfio-user"
labels = ["nvm", "rdma", "nvmet", "novec"]
socket = "{{ local.env.HOME }}/run/vfio-user-rocm-ernic.sock"
server = "/opt/rocm-ernic/bin/rocm-ernic --socket {socket} --backend nvmeof:size=1G,bs=4096,nqn=nvmet-test,ip=192.168.200.1,port=4420 --log-level info"

# How the guest reaches the target, for the tasks that set up its end. The
# target answers on .1, as the backend says, and the guest takes .11. Nothing on
# the emulated wire answers ARP for the target, so the guest gives it a static
# neighbour; any link-layer address works, as the emulator routes by queue pair.
[rig.devices.nic0.transport]
netdev = "rocm-ernic0"
guest_addr = "192.168.200.11/24"
traddr = "192.168.200.1"
trsvcid = "4420"
subnqn = "nvmet-test"
target_lladdr = "02:00:00:00:c0:01"
