# storage-node-emulated: the NVMe controllers xNVMe's QEMU matrix tests, one
# namespace on each, each controller on a root port of its own. They are listed
# in the order of their BDFs, 0000:01:00.0 for nvme0 to 0000:0b:00.0 for nvme10,
# which consumers' device lists name, so a controller is added at the end.
#
# The QEMU is the host container's, stock, without native KV: the KV controller
# is vfu_kvssd over vfio-user. The drives bypass the host page cache, since with
# writeback a FLUSH syncs every write since the last, and on a slow host disk
# that outlasts the guest's 30 s I/O timeout. See cijoe/scripts/rig.py for the
# format.

# nvme0: NVM
[rig.devices.nvme0]
provider = "qemu"
labels = ["nvm", "scc", "write_zeroes", "log_health_ns", "idfy_cs"]
device = "nvme,mdts=7,ioeventfd=on"
serial = "beef0000"
drives = ["id=nvme0n1,file={{ local.env.HOME }}/guests/storage-node-emulated/nvme0n1.img,format=raw,if=none,discard=on,detect-zeroes=unmap,cache=none,aio=io_uring"]
children = ["nvme-ns,drive=nvme0n1,nsid=1,logical_block_size=4096,physical_block_size=4096"]
image = {path = "{{ local.env.HOME }}/guests/storage-node-emulated/nvme0n1.img", size = "8G"}

# nvme1: ZNS
[rig.devices.nvme1]
provider = "qemu"
labels = ["zns", "zrwa", "log_health_ns", "idfy_cs"]
device = "nvme,mdts=7,ioeventfd=on"
serial = "beef0001"
drives = ["id=nvme1n1,file={{ local.env.HOME }}/guests/storage-node-emulated/nvme1n1.img,format=raw,if=none,discard=on,detect-zeroes=unmap,cache=none,aio=io_uring"]
children = ["nvme-ns,drive=nvme1n1,nsid=1,logical_block_size=4096,physical_block_size=4096,zoned=on,zoned.zone_size=32M,zoned.zone_capacity=28M,zoned.max_active=256,zoned.max_open=256,zoned.zrwas=131072,zoned.zrwafg=65536,zoned.numzrwa=256"]
image = {path = "{{ local.env.HOME }}/guests/storage-node-emulated/nvme1n1.img", size = "8G"}

# nvme2: KV
[rig.devices.nvme2]
provider = "vfio-user"
labels = ["kvs", "log_health_ns", "idfy_cs"]
socket = "{{ local.env.HOME }}/run/vfu_kvssd.sock"
server = "env VFU_KVSSD_TRACE=1 /usr/bin/vfu_kvssd -s {socket}"
serial = "VFUKVSSD000000000000"

# nvme3: NVM, for the fabrics tests
[rig.devices.nvme3]
provider = "qemu"
labels = ["nvm", "scc", "write_zeroes", "log_health_ns", "idfy_cs"]
device = "nvme,mdts=7,ioeventfd=on"
serial = "beef0003"
drives = ["id=nvme3n1,file={{ local.env.HOME }}/guests/storage-node-emulated/nvme3n1.img,format=raw,if=none,discard=on,detect-zeroes=unmap,cache=none,aio=io_uring"]
children = ["nvme-ns,drive=nvme3n1,nsid=1,logical_block_size=4096,physical_block_size=4096"]
image = {path = "{{ local.env.HOME }}/guests/storage-node-emulated/nvme3n1.img", size = "8G"}

# nvme4: NVM, large MDTS, 9, as stock QEMU rejects 0, unlimited
[rig.devices.nvme4]
provider = "qemu"
labels = ["nvm", "scc", "large_mdts", "log_health_ns", "idfy_cs"]
device = "nvme,mdts=9,ioeventfd=on"
serial = "beef0004"
drives = ["id=nvme4n1,file={{ local.env.HOME }}/guests/storage-node-emulated/nvme4n1.img,format=raw,if=none,discard=on,detect-zeroes=unmap,cache=none,aio=io_uring"]
