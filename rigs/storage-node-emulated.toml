image = {path = "{{ local.env.HOME }}/guests/storage-node-emulated/nvme4n1.img", size = "8G"}

# The subsystem nvme5 is in, which has FDP enabled
[rig.devices.nvme5_subsys]
provider = "qemu"
bus = false
device = "nvme-subsys,fdp=on,fdp.nruh=8,fdp.nrg=32,fdp.runs=40960"

# nvme5: FDP
[rig.devices.nvme5]
provider = "qemu"
labels = ["nvm", "scc", "fdp", "log_health_ns", "idfy_cs"]
device = "nvme,mdts=7,ioeventfd=on,subsys=nvme5_subsys"
serial = "beef0005"
drives = ["id=nvme5n1,file={{ local.env.HOME }}/guests/storage-node-emulated/nvme5n1.img,format=raw,if=none,discard=on,detect-zeroes=unmap,cache=none,aio=io_uring"]
children = ["nvme-ns,drive=nvme5n1,nsid=1,logical_block_size=4096,physical_block_size=4096,fdp.ruhs=0;5;6;7"]
image = {path = "{{ local.env.HOME }}/guests/storage-node-emulated/nvme5n1.img", size = "8G"}

