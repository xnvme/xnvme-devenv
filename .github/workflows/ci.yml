---
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  HOST_IMAGE: ghcr.io/${{ github.repository }}/host
  GUEST_IMAGE: ghcr.io/${{ github.repository }}/guest-ubuntu-2610

jobs:
  # Every file states its copyright and license, by its own header or REUSE.toml
  reuse:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - name: REUSE lint
      run: pipx run reuse lint

  # The cijoe scripts' unit tests, which need neither the host container nor KVM
  test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - name: Install cijoe and pytest
      run: |
        python3 -m venv .venv
        .venv/bin/pip install -q ./cijoe pytest
    - name: Run the unit tests
      run: make test PYTEST="$PWD/.venv/bin/pytest"

  # 'make host ci' is the whole run, as it is locally; the runner's large /mnt
  # takes the images, and the job only adds publishing on a tag.
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v6

    - name: Install cijoe, which builds the host container from the lock
      run: |
        pipx install ./cijoe --include-deps
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Build the host container
      run: make host HOST_IMAGE=xnvme-devenv-host:local

    - name: Derive the guest, then qualify it against the host's servers
      run: |
        sudo mkdir -p /mnt/xnvme-devenv && sudo chown "$(id -u):$(id -g)" /mnt/xnvme-devenv
        make ci HOST_IMAGE=xnvme-devenv-host:local WORKDIR=/mnt/xnvme-devenv

    - name: Collect the guest serial consoles and the server logs
      if: always()
      run: make logs WORKDIR=/mnt/xnvme-devenv SUDO=sudo

    - uses: actions/upload-artifact@v6.0.0
      if: always()
      with:
        name: cijoe-reports
        path: cijoe/cijoe-output-*/report.html
        if-no-files-found: warn

    - uses: oras-project/setup-oras@v2
      if: github.ref_type == 'tag'

    # The guest carries the lock it was made from, so a staged image says what is in it
    - name: Publish the guest and the host under the tag
      if: github.ref_type == 'tag'
      env:
        TAG: ${{ github.ref_name }}
        GH_TOKEN: ${{ github.token }}
      run: |
        echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
        echo "$GH_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
        docker tag xnvme-devenv-host:local "$HOST_IMAGE:$TAG"
        docker push "$HOST_IMAGE:$TAG"
        # Written by the container, as root
        sudo cp lock.toml /mnt/xnvme-devenv/home/system_imaging/disk/
        cd /mnt/xnvme-devenv/home/system_imaging/disk
        sha256sum xnvme-devenv-guest-x86_64.img.gz | sudo tee xnvme-devenv-guest-x86_64.img.gz.sha256
        oras push "$GUEST_IMAGE:$TAG" xnvme-devenv-guest-x86_64.img.gz \
          xnvme-devenv-guest-x86_64.img.gz.sha256 lock.toml

    # The release says what to pin: the host by tag, the guest by the digest of
    # its .img.gz layer, which cijoe's system_imaging stages; and carries the
    # lock and the cijoe reports of the run that made and qualified it
    - name: Create the GitHub release, with the lock and the cijoe reports
      if: github.ref_type == 'tag'
      env:
        TAG: ${{ github.ref_name }}
        GH_TOKEN: ${{ github.token }}
      run: |
        layer=$(oras manifest fetch "$GUEST_IMAGE:$TAG" | jq -r \
          '.layers[] | select(.annotations["org.opencontainers.image.title"] == "xnvme-devenv-guest-x86_64.img.gz") | .digest')
        test -n "$layer"
        sudo tar -czf cijoe-reports.tar.gz -C cijoe cijoe-output-host cijoe-output-derive cijoe-output-qualify-cluster cijoe-output-qualify-storage cijoe-output-qualify-fabrics cijoe-output-qualify-compute
        cp /mnt/xnvme-devenv/home/system_imaging/disk/xnvme-devenv-guest-x86_64.img.gz.sha256 .
        cat > notes.md <<NOTES
        Host: \`$HOST_IMAGE:$TAG\`

        Guest: \`$GUEST_IMAGE:$TAG\`, whose .img.gz layer is \`$layer\`;
        pin it as \`oras://$GUEST_IMAGE@$layer\`.

        Attached: the lock it was made from, the guest image's sha256, and the cijoe
        reports of the host build, the derive and the qualification.
        NOTES
        gh release create "$TAG" --title "$TAG" --notes-file notes.md \
          lock.toml xnvme-devenv-guest-x86_64.img.gz.sha256 cijoe-reports.tar.gz
