---
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  HOST_IMAGE: ghcr.io/${{ github.repository }}/host
  GUEST_IMAGE: ghcr.io/${{ github.repository }}/guest-ubuntu-2610

jobs:
  # Every file states its copyright and license, by its own header or REUSE.toml
  reuse:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - name: REUSE lint
      run: pipx run reuse lint

  # The cijoe scripts' unit tests, then 'make host ci', the whole run, as it is
  # locally; the runner's large /mnt takes the images. A green run on main
  # ends by publishing, once VERSION names a version that has no tag yet; the
  # release creates the tag.
  test:
    needs: [reuse]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v6

    - name: Run the cijoe scripts' unit tests, which need neither the host container nor KVM
      run: |
        python3 -m venv "$RUNNER_TEMP/venv"
        "$RUNNER_TEMP/venv/bin/pip" install -q ./cijoe pytest
        make test PYTEST="$RUNNER_TEMP/venv/bin/pytest"

    - name: Install cijoe, which builds the host container from the lock
      run: |
        pipx install ./cijoe --include-deps
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Build the host container
      run: make host HOST_IMAGE=xnvme-devenv-host:local

    - name: Derive the guest, then qualify it against the host's servers
      run: |
        sudo mkdir -p /mnt/xnvme-devenv && sudo chown "$(id -u):$(id -g)" /mnt/xnvme-devenv
        make ci HOST_IMAGE=xnvme-devenv-host:local WORKDIR=/mnt/xnvme-devenv

    - name: Collect the guest serial consoles and the server logs
      if: always()
      run: make logs WORKDIR=/mnt/xnvme-devenv SUDO=sudo

    - uses: actions/upload-artifact@v6.0.0
      if: always()
      with:
        name: cijoe-reports
        path: cijoe/cijoe-output-*/report.html
        if-no-files-found: warn

    - name: Decide whether this run releases, and under which tag
      id: release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        tag=""
        if [ "${{ github.event_name }}" = push ] && [ "${{ github.ref }}" = refs/heads/main ]; then
          tag="v$(cat VERSION)"
          if gh api "repos/${{ github.repository }}/git/ref/tags/$tag" > /dev/null 2>&1; then
            tag=""
          fi
        fi
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "release: ${tag:-none}"

    - uses: oras-project/setup-oras@v2
      if: steps.release.outputs.tag != ''

    # The guest carries the lock it was made from, so a staged image says what is in it.
    # It is also tagged with the hash of its inputs, under which a later release
    # made from the same finds it; a guest staged that way is tagged again, not pushed
    - name: Publish the guest and the host under the tag
      if: steps.release.outputs.tag != ''
      env:
        TAG: ${{ steps.release.outputs.tag }}
        GH_TOKEN: ${{ github.token }}
      run: |
        echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
        echo "$GH_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
        docker tag xnvme-devenv-host:local "$HOST_IMAGE:$TAG"
        docker push "$HOST_IMAGE:$TAG"
        cd /mnt/xnvme-devenv/home/system_imaging/disk
        inputs="inputs-$(cat xnvme-devenv-guest-x86_64.inputs 2>/dev/null)"
        if [ -s xnvme-devenv-guest-x86_64.reused ]; then
          oras tag "$GUEST_IMAGE:$inputs" "$TAG"
        else
          # Written by the container, as root
          sudo cp "$GITHUB_WORKSPACE/lock.toml" .
          sha256sum xnvme-devenv-guest-x86_64.img.gz | sudo tee xnvme-devenv-guest-x86_64.img.gz.sha256
          oras push "$GUEST_IMAGE:$TAG" xnvme-devenv-guest-x86_64.img.gz \
            xnvme-devenv-guest-x86_64.img.gz.sha256 lock.toml
          if [ "$inputs" != inputs- ]; then oras tag "$GUEST_IMAGE:$TAG" "$inputs"; fi
        fi

    # The release says what to pin: the host and the guest by tag, which cijoe's
    # system_imaging stages once from 0.9.68, or the guest by the digest of its
    # .img.gz layer; and carries the lock and the cijoe reports of the run that
    # made and qualified it
    - name: Create the GitHub release, with the lock and the cijoe reports
      if: steps.release.outputs.tag != ''
      env:
        TAG: ${{ steps.release.outputs.tag }}
        GH_TOKEN: ${{ github.token }}
      run: |
        layer=$(oras manifest fetch "$GUEST_IMAGE:$TAG" | jq -r \
          '.layers[] | select(.annotations["org.opencontainers.image.title"] == "xnvme-devenv-guest-x86_64.img.gz") | .digest')
        test -n "$layer"
        sudo tar -czf cijoe-reports.tar.gz -C cijoe $(cd cijoe && ls -d cijoe-output-*)
        echo "${layer#sha256:}  xnvme-devenv-guest-x86_64.img.gz" > xnvme-devenv-guest-x86_64.img.gz.sha256
        cat > notes.md <<NOTES
        Host: \`$HOST_IMAGE:$TAG\`

        Guest: \`$GUEST_IMAGE:$TAG\`; pin it as \`oras://$GUEST_IMAGE:$TAG\`, or,
        to pin the bytes themselves, by its .img.gz layer, \`oras://$GUEST_IMAGE@$layer\`.

        Attached: the lock it was made from, the guest image's sha256, and the cijoe
        reports of the host build, the derive, or the reuse of a guest made from
        the same inputs, and the qualification.
        NOTES
        gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md \
          lock.toml xnvme-devenv-guest-x86_64.img.gz.sha256 cijoe-reports.tar.gz
