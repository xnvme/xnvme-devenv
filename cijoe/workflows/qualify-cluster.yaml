---
doc: |
  Qualify an xnvme-devenv guest on the cluster-node-emulated rig

  Boots the derived guest on the cluster-node-emulated rig, rocjitsu's GPU,
  rocm-ernic's NIC and an NVMe drive behind one PCIe switch, with the NIC
  present at boot, then plugs the GPU, which udev brings up with the amdgpu
  the image carries. Then runs a GEMM on the GPU and RDMA WRITE, READ and
  SEND into and out of VRAM, and checks with the NIC's server that the
  transfers went through VRAM rather than system memory.
  Before those, checks that the guest runs our kernel and that io_uring moves
  data between an emulated NVMe drive and a dma-buf.

steps:
- name: host_tools
  uses: core.tools_check
  with:
    target_name: initiator

- name: guest_kill
  uses: rig_guest_kill
  with:
    guest_name: qualify

- name: guest_initialize
  uses: qemu.guest_initialize
  with:
    guest_name: qualify
    system_image_name: xnvme-devenv-guest-x86_64

- name: guest_start
  uses: rig_guest_start
  with:
    guest_name: qualify

- name: root_unlock
  uses: root_unlock

- name: gpu_plug
  uses: rig_device_plug
  with:
    guest_name: qualify
    device_name: gpu0

- name: gpu_up
  run: |
    for _ in $(seq 36); do test -e /dev/kfd && ls /dev/dri | grep -q renderD && break; sleep 5; done
    test -e /dev/kfd && ls /dev/dri | grep -q renderD || { dmesg | grep -i amdgpu | tail -40; false; }

- name: facts
  uses: core.facts_gather

- name: test_controllers
  run: |
    test {{ target.nvme | length }} -eq 1

- name: test_gpu_and_nic
  run: |
    test -n "{% for g in target.gpu if g.render %}{{ g.render | first }}{% endfor %}"
    ls {% for g in target.gpu if g.render %}{{ g.render | first }}{% endfor %}
    test -n "{% for n in target.nic if n.rdma %}{{ n.rdma | first }}{% endfor %}"

# Our kernel, not the stock one, and its io_uring dma-buf support against the
# emulated NVMe drive
- name: test_kernel
  run: |
    uname -r | grep -x '{{ config.lock.kernel.release }}'
    rocjitsu-guest-check iouring-dmabuf {% for c in target.nvme.values() if c.serial == config.rig.devices.nvme0.serial %}{{ c.namespaces[0].bdev }}{% endfor %}

# HIP programs other than the guest checks, xNVMe's among them, rely on it
- name: test_hip_env
  run: |
    printenv HSA_HOTSWAP_DISABLE | grep -x 1

- name: test_gemm
  run: |
    rocjitsu-guest-check gemm

- name: test_vram_io
  run: |
    rocjitsu-guest-check iouring-vram {% for c in target.nvme.values() if c.serial == config.rig.devices.nvme0.serial %}{{ c.namespaces[0].bdev }}{% endfor %}

- name: test_p2p
  run: |
    rocjitsu-guest-check p2p {{ config.rocm_ernic.transport.ibdev }}

- name: check_p2p_through_vram
  uses: rocm_ernic_peer_check

- name: guest_shutdown
  uses: rig_guest_kill
  with:
    guest_name: qualify
