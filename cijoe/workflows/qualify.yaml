---
doc: |
  Qualify an xnvme-images guest against the host's servers

  Starts rocjitsu and rocm-ernic, boots the derived guest with the NIC and a
  free port beside it on one PCIe switch, and hot-plugs the GPU, which udev
  brings up with the amdgpu the image carries. Then runs a GEMM on the GPU
  and RDMA WRITE, READ and SEND into and out of VRAM, and checks with the
  NIC's server that the transfers went through VRAM rather than system memory.
  Before those, checks that the guest runs our kernel and that io_uring moves
  data between an emulated NVMe drive and a dma-buf.

steps:
- name: guest_kill
  uses: qemu.guest_kill
  with:
    guest_name: qualify

- name: guest_initialize
  uses: qemu.guest_initialize
  with:
    guest_name: qualify
    system_image_name: xnvme-images-guest-x86_64

- name: guest_start
  uses: rocjitsu_guest_start
  with:
    guest_name: qualify

- name: root_unlock
  uses: root_unlock

- name: gpu_attach
  uses: rocjitsu_gpu_attach
  with:
    guest_name: qualify

# Our kernel, not the stock one, and its io_uring dma-buf support against the
# emulated NVMe drive
- name: test_kernel
  run: |
    uname -r | grep -x '{{ config.derive.kernel }}'
    rocjitsu-guest-check iouring-dmabuf /dev/nvme0n1

- name: test_gemm
  run: |
    rocjitsu-guest-check gemm

- name: test_p2p
  run: |
    rocjitsu-guest-check p2p {{ config.rocm_ernic.transport.ibdev }}

- name: check_p2p_through_vram
  uses: rocm_ernic_peer_check

- name: guest_shutdown
  uses: qemu.guest_kill
  with:
    guest_name: qualify
