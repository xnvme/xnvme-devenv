---
doc: |
  Qualify an xnvme-devenv guest on the storage-node-passthru rig

  Boots the derived guest with the machine's own NVMe drive passed through,
  which rig_guest_start binds to vfio-pci, and checks that the guest drives it:
  one controller, not QEMU's (vendor 0x1b36), with a namespace, as the facts
  core.facts_gather records it, with the serial the config gives, if it gives
  one. Needs the drive's host BDF, see rigs/storage-node-passthru.toml.

steps:
- name: guest_kill
  uses: rig_guest_kill
  with:
    guest_name: qualify

- name: guest_initialize
  uses: qemu.guest_initialize
  with:
    guest_name: qualify
    system_image_name: xnvme-devenv-guest-x86_64

- name: guest_start
  uses: rig_guest_start
  with:
    guest_name: qualify

- name: root_unlock
  uses: root_unlock

- name: facts
  uses: core.facts_gather

- name: test_controllers
  run: |
    test {{ target.nvme | length }} -eq 1

- name: test_drive
  run: |
    {% for name, c in target.nvme.items() %}
    test -z "{{ config.rig.devices.nvme0.get('serial', '') }}" || test "{{ c.serial }}" = "{{ config.rig.devices.nvme0.get('serial', '') }}"
    test "$(cat /sys/bus/pci/devices/{{ c.bdf }}/vendor)" != 0x1b36
    ls {{ c.namespaces[0].cdev }}
    nvme id-ctrl /dev/{{ name }}
    {% endfor %}

- name: guest_shutdown
  uses: rig_guest_kill
  with:
    guest_name: qualify
