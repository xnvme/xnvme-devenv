---
doc: |
  Derive the xnvme-images guest from nosi

  Boots the nosi base the lock pins, installs the guest debs, whose DKMS
  packages build their modules for its kernel here, and the guest checks,
  then powers it off and exports the qcow2 qualify boots and the .img.gz a
  release publishes.

steps:
- name: guest_kill
  uses: qemu.guest_kill
  with:
    guest_name: derive

- name: stage_nosi_base
  uses: system_imaging.diskimage_from_oras
  with:
    pattern: "nosi-base-x86_64"

- name: guest_initialize
  uses: qemu.guest_initialize
  with:
    guest_name: derive
    system_image_name: nosi-base-x86_64

- name: guest_start
  uses: qemu.guest_start
  with:
    guest_name: derive

- name: root_unlock
  uses: root_unlock

- name: guest_derive
  uses: guest_derive

- name: guest_export
  uses: guest_export
  with:
    guest_name: derive
