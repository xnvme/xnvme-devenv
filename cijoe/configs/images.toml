# Deriving the guest from nosi and qualifying it against the host's servers.
# The servers are the ones the host container installs. Taken with lock.toml,
# which gives the nosi base's oras.url and everything else a release pins.

[cijoe]
default_target = "root"

[cijoe.targets.root.ssh]
username = "root"
password = "root"
hostname = "localhost"
port = 4200

# Operator account on nosi images; used by root_unlock.
[cijoe.targets.odus.ssh]
username = "odus"
password = "odus.321"
hostname = "localhost"
port = 4200

[qemu]
img_bin = "qemu-img"

[qemu.systems.x86_64]
bin = "qemu-system-x86_64"

# Sized as xNVMe's guests, for a GitHub-hosted runner
[qemu.guests.derive]
path = "{{ local.env.HOME }}/guests/xnvme-devenv-derive"
system_label = "x86_64"
system_args.kwa = {cpu = "host", smp = 4, m = "6G", accel = "kvm"}
system_args.raw = """\
-M q35 \
"""
system_args.tcp_forward = {host = 4200, guest = 22}

# With a vIOMMU, as xNVMe's iommu_enabled guests, so a device can be handed to
# vfio-pci; it takes no PCI slot, so no rig's BDFs move. configs/no-iommu.toml
# takes it away, for qualify-pcie-noiommu
[qemu.guests.qualify]
path = "{{ local.env.HOME }}/guests/xnvme-devenv-qualify"
system_label = "x86_64"
system_args.kwa = {cpu = "host", smp = 4, m = "6G", accel = "kvm"}
system_args.raw = """\
-M "type=q35,kernel_irqchip=split" \
-device "intel-iommu,pt=on,intremap=on,caching-mode=on" \
"""
system_args.tcp_forward = {host = 4200, guest = 22}

[system-imaging.images.nosi-base-x86_64]
system_label = "x86_64"
disk.path = "{{ local.env.HOME }}/system_imaging/disk/nosi-base.qcow2"

# What derive produces and qualify boots
[system-imaging.images.xnvme-devenv-guest-x86_64]
system_label = "x86_64"
disk.path = "{{ local.env.HOME }}/system_imaging/disk/xnvme-devenv-guest.qcow2"

[derive]
debs = "/tmp/xnvme-devenv/guest-debs"
gz_path = "{{ local.env.HOME }}/system_imaging/disk/xnvme-devenv-guest-x86_64.img.gz"
# Where guest_reuse looks for a guest made from the same inputs, the hash of
# which it writes to inputs_path, and, when it staged one, its tag and layer
# to reused_path, as the Makefile's DERIVE_REUSED names it
image = "ghcr.io/xnvme/xnvme-devenv/guest-ubuntu-2610"
inputs_path = "{{ local.env.HOME }}/system_imaging/disk/xnvme-devenv-guest-x86_64.inputs"
reused_path = "{{ local.env.HOME }}/system_imaging/disk/xnvme-devenv-guest-x86_64.reused"

# The guest's name for the NIC's RDMA device; the servers are the rig's
[rocm_ernic.transport]
ibdev = "rocm-rdma-ernic0"

# The NQN qualify-tcp exports nvme3 under, its own, so the guest does not take
# the TCP path for another path to nvme3's subsystem
[qualify_tcp]
subnqn = "nqn.2026-10.io.xnvme:devenv-tcp"
