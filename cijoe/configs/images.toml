# Deriving the guest from nosi and qualifying it against the host's servers.
# The servers are the ones the host container installs; the guest base comes
# from lock.toml through XI_GUEST_BASE, which the Makefile exports.

[cijoe.transport.root]
username = "root"
password = "root"
hostname = "localhost"
port = 4200

# Operator account on nosi images; used by root_unlock.
[cijoe.transport.odus]
username = "odus"
password = "odus.321"
hostname = "localhost"
port = 4200

[qemu]
img_bin = "qemu-img"

[qemu.systems.x86_64]
bin = "qemu-system-x86_64"

# Sized as xNVMe's guests, for a GitHub-hosted runner
[qemu.guests.derive]
path = "{{ local.env.HOME }}/guests/xnvme-devenv-derive"
system_label = "x86_64"
system_args.kwa = {cpu = "host", smp = 4, m = "6G", accel = "kvm"}
system_args.raw = """\
-M q35 \
"""
system_args.tcp_forward = {host = 4200, guest = 22}

[qemu.guests.qualify]
path = "{{ local.env.HOME }}/guests/xnvme-devenv-qualify"
system_label = "x86_64"
system_args.kwa = {cpu = "host", smp = 4, m = "6G", accel = "kvm"}
system_args.raw = """\
-M q35 \
"""
system_args.tcp_forward = {host = 4200, guest = 22}

[system-imaging.images.nosi-base-x86_64]
system_label = "x86_64"
oras.url = "oras://{{ local.env.XI_GUEST_BASE }}"
disk.path = "{{ local.env.HOME }}/system_imaging/disk/nosi-base.qcow2"

# What derive produces and qualify boots
[system-imaging.images.xnvme-devenv-guest-x86_64]
system_label = "x86_64"
disk.path = "{{ local.env.HOME }}/system_imaging/disk/xnvme-devenv-guest.qcow2"

[derive]
debs = "/tmp/xnvme-devenv/guest-debs"
kernel = "{{ local.env.XI_KERNEL }}"
gz_path = "{{ local.env.HOME }}/system_imaging/disk/xnvme-devenv-guest-x86_64.img.gz"

[rocm_ernic]
bin = "/opt/rocm-ernic/bin/rocm-ernic"
socket = "{{ local.env.HOME }}/run/vfio-user-rocm-ernic.sock"
backend = "loopback"
log_level = "info"

# The guest's name for the NIC's RDMA device
[rocm_ernic.transport]
ibdev = "rocm-rdma-ernic0"

# 'vram_aperture' is the size of the GPU's BAR0, which rocjitsu backs with its
# VRAM memfd from offset 0; the NIC server binds the DMA region of that size.
[rocjitsu]
bin = "/opt/rocjitsu/bin/rocjitsu"
vram_bin = "/opt/rocjitsu/bin/rocjitsu-vram"
config = "/opt/rocjitsu/share/configs/gfx1250_mi455x_xnvme_ci.json"
socket = "{{ local.env.HOME }}/run/vfio-user-rocjitsu.sock"
vram_aperture = "2G"
