[project]
name = "xnvme-devenv-cijoe"
version = "0.1.0"
description = "CIJOE environment for the xnvme-devenv derive and qualification"
requires-python = ">=3.9"

# As xNVMe pins it, so the scripts move between the two unchanged
# devbind and iommu pass devices through, so a host needs neither installed
dependencies = [
    "cijoe==0.9.69",
    "devbind==0.4.0",
    "iommu==0.4.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# The scripts, as the cijoe package 'xnvme_devenv', for consumers' tasks to
# use as 'xnvme_devenv.<script>'; this directory's own tasks find them here
[tool.setuptools]
packages = ["cijoe.xnvme_devenv", "cijoe.xnvme_devenv.scripts"]

[tool.setuptools.package-dir]
"cijoe.xnvme_devenv" = "."
"cijoe.xnvme_devenv.scripts" = "scripts"
