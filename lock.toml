# Every input of a release, pinned. A release is these, assembled and
# qualified; bumping a pin here is how anything in the images moves.
#
# It is a cijoe config: the workflows take it with --config next to
# cijoe/configs/images.toml, and the guest artifact a release publishes
# carries it, so a staged guest says what it was made from.

# The guest's base, as the digest of its .img.gz layer, which is what cijoe's
# system_imaging stages. ubuntu-2610-rocm:2026.W43, built from nosi e742b02.
[system-imaging.images.nosi-base-x86_64]
oras.url = "oras://ghcr.io/safl/nosi/ubuntu-2610-rocm@sha256:33a34476eee7f0ab9ced75c2c115c107e3f52bd5bd0084528b5079ac74019ad4"

# The host container's base, by manifest digest; it has stock QEMU and cijoe.
[lock.nosi]
host = "ghcr.io/safl/nosi/ubuntu-2604-docker@sha256:0c73b119fa5cd0b0388d45250b306039daf91be283ee8aed8e27be7deead2ab4"

